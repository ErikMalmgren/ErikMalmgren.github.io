server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;

    # Scripts are same-origin files only — never inline, so no 'unsafe-inline'.
    # connect-src is required: the shell fetches pages to print their content,
    # and default-src 'none' would otherwise block those requests. data: is for
    # the inline SVG favicon. form-action stays 'none' as a backstop — the
    # shell's prompt form is always cancelled in JS and must never submit.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options          "DENY"                            always;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_types        text/plain text/css application/javascript application/xml image/svg+xml;

    # Liveness probe — used by the Dockerfile HEALTHCHECK and by whatever
    # orchestrator ends up running this.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Allow /about as well as /about.html, so URLs stay clean if the site ever
    # moves off GitHub Pages.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* \.(css|js|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.pdf$ {
        expires 1d;
        add_header Cache-Control "public";
    }
}
